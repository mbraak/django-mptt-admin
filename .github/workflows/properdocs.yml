name: Publish docs via GitHub Pages

on:
  push:
    branches:
      - master
      - properdocs-workflow
  workflow_dispatch:

# Only one deployment at a time; a newer push cancels a pending one, so an
# older build can never overwrite the docs of a newer commit
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - name: Run properdocs
        run: uv run --locked --only-group docs properdocs build --strict

      - name: Upload docs
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy docs
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
