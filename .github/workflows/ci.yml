name: Continuous integration

on: [push]

jobs:
  runner-job:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        django: ["django==5.2.19", "django==6.0.10", "django==6.1.3"]
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Check spelling
        uses: streetsidesoftware/cspell-action@v9
        with:
          files: |
            frontend/src/**/*.ts
            django_mptt_admin/**/*.py
            example_project/**/*.py
          incremental_files_only: false
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install javascript packages
        working-directory: ./frontend
        run: pnpm install
      - name: Get playwright version
        id: playwright-version
        run: |
          echo "VERSION=$(grep -o '"playwright==[^"]*"' pyproject.toml | cut -d= -f3 | tr -d '"')" >> $GITHUB_OUTPUT
      - name: Cache playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.VERSION }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          # Separate cache per Django version, because it's installed outside uv.lock
          cache-suffix: ${{ matrix.django }}
      - name: Install python packages
        run: |
          uv sync --locked
          uv pip install "${{ matrix.django }}"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/playwright install chromium
      - name: Build javascript
        working-directory: ./frontend
        run: pnpm run build
      - name: Javascript test
        working-directory: ./frontend
        run: pnpm run test:coverage
      - name: Collect static files
        run: python manage.py collectstatic --no-input
        working-directory: example_project
      - name: Create javascript coverage directory
        run: mkdir js_coverage
      - name: Test with coverage
        run: |
          COVERAGE=true coverage run example_project/manage.py test --parallel auto django_mptt_example
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PASSWORD: postgres
          POSTGRES_PORT: 5432
      - name: Merge Python coverage
        run: coverage combine && coverage report && coverage lcov
      - name: Merge javascript coverage
        working-directory: ./coverage
        run: pnpm i && pnpm run merge_coverage
      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
