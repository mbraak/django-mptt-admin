[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-mptt-admin"
version = "3.1.1"
description = "Django-mptt-admin provides a nice Django Admin interface for Mptt models"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.rst"]
authors = [{ name = "Marco Braak", email = "marco.braak@planet.nl" }]
requires-python = ">=3.10"
dependencies = ["django-mptt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Homepage = "https://github.com/mbraak/django-mptt-admin"
Documentation = "https://mbraak.github.io/django-mptt-admin/"
Changelog = "https://mbraak.github.io/django-mptt-admin/#changelog"

[dependency-groups]
# Django version used for local development; CI overrides it per matrix entry
django = ["Django>=6.1,<6.2"]
# Packages used by the tests of the example project in example_project/
test = [
    "beautifulsoup4==4.15.0",
    "cssselect==1.5.0",
    "django-mptt==0.20.0",
    "django-webtest==1.9.15",
    "lxml==6.1.3",
    "playwright==1.64.1",
    "psycopg==3.3.8",
    "pyquery==2.1.0",
    "tblib==3.2.2",
    "waitress==3.0.2",
    "WebOb==1.8.11",
    "WebTest==3.0.7",
]
ci = [
    "coverage==7.16.2",
    "ruff==0.17.4",
]
docs = [
    "mkdocs-materialx==10.2.2",
    "properdocs==1.6.7",
]
# Installed by default with `uv sync`
dev = [
    { include-group = "django" },
    { include-group = "test" },
    { include-group = "ci" },
]

[tool.uv]
exclude-newer = "7 days"

[tool.uv.dependency-groups]
# Django 6.1 needs Python 3.12+; the package itself still supports 3.10+
django = { requires-python = ">=3.12" }
dev = { requires-python = ">=3.12" }

[tool.setuptools.packages.find]
include = ["django_mptt_admin*"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["migrations", "frontend", "coverage", "docs", "site"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["django_mptt_admin", "django_mptt_example"]
